apiVersion: v1
kind: Secret
metadata:
  name: {{ include "auth-service.fullname" . }}-secrets
  labels:
    {{- include "auth-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  AES_SECRET_KEY: {{ required "auth-service: falta secrets.aesSecretKey (ver values.example.yaml)" .Values.secrets.aesSecretKey | quote }}
  HMAC_SECRET_KEY: {{ required "auth-service: falta secrets.hmacSecretKey (ver values.example.yaml)" .Values.secrets.hmacSecretKey | quote }}
  SEED_ADMIN_PASSWORD: {{ required "auth-service: falta secrets.seedAdminPassword (ver values.example.yaml)" .Values.secrets.seedAdminPassword | quote }}
