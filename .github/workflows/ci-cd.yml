name: CI/CD - Practica 7

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "P5/**"
      - ".github/workflows/ci-cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "P5/**"
      - ".github/workflows/ci-cd.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_SERVICES: api-gateway auth-service authz-service
  PYTHON_SERVICES: productos-service pedidos-service reportes-service
  ALL_SERVICES: api-gateway auth-service authz-service pedidos-service productos-service reportes-service

jobs:
  # ---------- Etapa 1: Build + Test (Node) ----------
  test-node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, auth-service, authz-service]
    defaults:
      run:
        working-directory: P5/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: P5/${{ matrix.service }}/package-lock.json

      - name: Instalar dependencias (build)
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test

  # ---------- Etapa 1: Build + Test (Python) ----------
  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [productos-service, pedidos-service, reportes-service]
    defaults:
      run:
        working-directory: P5/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: P5/${{ matrix.service }}/requirements-dev.txt

      - name: Instalar dependencias (build)
        run: pip install -r requirements-dev.txt

      - name: Ejecutar pruebas
        # "python -m pytest" (y no "pytest" a secas) agrega el directorio
        # actual a sys.path, que es lo que permite que las pruebas hagan
        # "from src...." sin necesitar un __init__.py en tests/.
        run: python -m pytest -q

  # ---------- Etapa 2: Construir y publicar imagenes Docker ----------
  build-and-push:
    needs: [test-node, test-python]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api-gateway, auth-service, authz-service, pedidos-service, productos-service, reportes-service]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Autenticarse en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir nombre de imagen (en minuscula, requerido por GHCR)
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/p5-${{ matrix.service }}" >> "$GITHUB_ENV"

      - name: Build y push de la imagen
        uses: docker/build-push-action@v6
        with:
          context: P5/${{ matrix.service }}
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # NOTA (Practica 8): este workflow ya NO despliega al cluster. El job
  # "deploy-k8s" que existia aqui (que instalaba el chart de Helm
  # directamente contra un kind efimero) se quito porque la Practica 8
  # prohibe explicitamente que cualquier workflow del repo aplique
  # manifiestos o cambie imagenes contra un cluster real de forma directa
  # — el despliegue ahora es exclusivamente via GitOps (ver
  # .github/workflows/ci-cd-p8.yml y el repo Practicas-SA-GitOps). La
  # Practica 7 ya fue evaluada con el job anterior; esto no cambia esa
  # nota, solo evita que el archivo siga contando como despliegue directo
  # en verificaciones de practicas posteriores.
