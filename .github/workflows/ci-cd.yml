name: CI/CD - Practica 7

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "P5/**"
      - ".github/workflows/ci-cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "P5/**"
      - ".github/workflows/ci-cd.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_SERVICES: api-gateway auth-service authz-service
  PYTHON_SERVICES: productos-service pedidos-service reportes-service
  ALL_SERVICES: api-gateway auth-service authz-service pedidos-service productos-service reportes-service

jobs:
  # ---------- Etapa 1: Build + Test (Node) ----------
  test-node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, auth-service, authz-service]
    defaults:
      run:
        working-directory: P5/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: P5/${{ matrix.service }}/package-lock.json

      - name: Instalar dependencias (build)
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test

  # ---------- Etapa 1: Build + Test (Python) ----------
  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [productos-service, pedidos-service, reportes-service]
    defaults:
      run:
        working-directory: P5/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: P5/${{ matrix.service }}/requirements-dev.txt

      - name: Instalar dependencias (build)
        run: pip install -r requirements-dev.txt

      - name: Ejecutar pruebas
        # "python -m pytest" (y no "pytest" a secas) agrega el directorio
        # actual a sys.path, que es lo que permite que las pruebas hagan
        # "from src...." sin necesitar un __init__.py en tests/.
        run: python -m pytest -q

  # ---------- Etapa 2: Construir y publicar imagenes Docker ----------
  build-and-push:
    needs: [test-node, test-python]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api-gateway, auth-service, authz-service, pedidos-service, productos-service, reportes-service]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Autenticarse en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir nombre de imagen (en minuscula, requerido por GHCR)
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/p5-${{ matrix.service }}" >> "$GITHUB_ENV"

      - name: Build y push de la imagen
        uses: docker/build-push-action@v6
        with:
          context: P5/${{ matrix.service }}
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ---------- Etapa 3: Despliegue automatico en k8s local (kind) ----------
  deploy-k8s:
    needs: build-and-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Definir prefijo de imagen (en minuscula)
        run: echo "IMAGE_PREFIX=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Crear cluster de Kubernetes local (kind)
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: sa-p5-ci

      - uses: azure/setup-helm@v4
        with:
          version: "v3.16.1"

      - name: Autenticarse en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Descargar imagenes y cargarlas en el cluster kind
        run: |
          set -e
          for svc in $ALL_SERVICES; do
            docker pull "${IMAGE_PREFIX}/p5-${svc}:${{ github.sha }}"
            kind load docker-image "${IMAGE_PREFIX}/p5-${svc}:${{ github.sha }}" --name sa-p5-ci
          done

      - name: Resolver dependencias del chart (postgresql / rabbitmq)
        run: helm dependency build P5/charts/sa-p5

      - name: Generar secretos efimeros para el cluster de CI
        run: echo "CI_AES_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Deploy con Helm
        run: |
          helm upgrade --install sa-p5 P5/charts/sa-p5 \
            -n sa-p5 --create-namespace \
            -f P5/charts/sa-p5/values-dev.yaml \
            --set postgresql.auth.postgresPassword=ci-postgres-password \
            --set rabbitmq.auth.username=sa_p5 \
            --set rabbitmq.auth.password=ci-rabbitmq-password \
            --set sharedSecrets.jwtSecret=ci-jwt-secret-para-pruebas \
            --set auth-service.secrets.aesSecretKey="${CI_AES_KEY}" \
            --set auth-service.secrets.hmacSecretKey=ci-hmac-secret \
            --set auth-service.secrets.seedAdminPassword=ci-seed-admin-password \
            --set api-gateway.image.repository=${IMAGE_PREFIX}/p5-api-gateway \
            --set api-gateway.image.tag=${{ github.sha }} \
            --set auth-service.image.repository=${IMAGE_PREFIX}/p5-auth-service \
            --set auth-service.image.tag=${{ github.sha }} \
            --set authz-service.image.repository=${IMAGE_PREFIX}/p5-authz-service \
            --set authz-service.image.tag=${{ github.sha }} \
            --set pedidos-service.image.repository=${IMAGE_PREFIX}/p5-pedidos-service \
            --set pedidos-service.image.tag=${{ github.sha }} \
            --set productos-service.image.repository=${IMAGE_PREFIX}/p5-productos-service \
            --set productos-service.image.tag=${{ github.sha }} \
            --set reportes-service.image.repository=${IMAGE_PREFIX}/p5-reportes-service \
            --set reportes-service.image.tag=${{ github.sha }} \
            --wait --timeout 8m

      - name: Verificar pods y servicios desplegados
        run: |
          kubectl get pods -n sa-p5 -o wide
          kubectl get svc -n sa-p5

      - name: Smoke test del api-gateway
        run: |
          kubectl port-forward -n sa-p5 svc/api-gateway 8080:8080 &
          sleep 5
          curl -sf http://localhost:8080/health
