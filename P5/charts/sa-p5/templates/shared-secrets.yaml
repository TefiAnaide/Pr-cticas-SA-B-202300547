{{/*
Secreto compartido entre los microservicios que necesitan verificar el
mismo JWT (auth, productos, reportes, pedidos). Nombre fijo (no usa el
helper fullname) para que cualquier subchart pueda referenciarlo por
nombre literal, igual que ya se hace con el Service "api-gateway" en el
Ingress.

La contrasena de Postgres NO va aqui: el chart de Bitnami (dependencia
"postgresql") ya genera su propio Secret ("postgres", por el
fullnameOverride en values.yaml) con la clave "postgres-password" —
los subcharts que necesiten DB_PASSWORD deben leer de ESE Secret
directamente (ver charts/auth-service/templates/deployment.yaml), para
no tener la misma contrasena duplicada en dos Secrets distintos.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: sa-p5-shared-secrets
  labels:
    {{- include "sa-p5.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ required "Debes definir sharedSecrets.jwtSecret (ver values.example.yaml)" .Values.sharedSecrets.jwtSecret | quote }}
